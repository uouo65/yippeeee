<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보안 안내</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
  }
  body {
    background-color: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", "Malgun Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .message {
    font-size: clamp(20px, 6vw, 32px);
    font-weight: 700;
    line-height: 1.5;
    max-width: 480px;
    letter-spacing: -0.5px;
  }
</style>
</head>
<body>
  <div class="message">
    당신의 개인 정보는 털렸습니다.<br>
    누르기 전에 생각했나요?
  </div>
</body>
</html>
